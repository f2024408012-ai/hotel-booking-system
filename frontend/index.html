<!DOCTYPE html>
<html>
<head>
    <title>Hotel Booking</title>
    <link rel="stylesheet" href="style.css">
<img src="hotel.jpg">
<form action="https://YOUR-NGROK-URL/book" method="POST">
</head>

<body>

<div class="container">

    <h1>Hotel Booking</h1>

    <form action="https://http://127.0.0.1:4040.ngrok-free.dev/book" method="POST">
    </form>

        <label>Full Name</label>
        <input type="text" name="full_name" placeholder="Enter your name" required>

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email" required>

        <label>Phone</label>
        <input type="text" name="phone" placeholder="Enter phone number" required>

        <label>Check-In</label>
        <input type="date" name="check_in" required>

        <label>Check-Out</label>
        <input type="date" name="check_out" required>

        <label>Room Type</label>
        <select name="room_type">
            <option>Single</option>
            <option>Double</option>
            <option>Deluxe</option>
            <option>Suite</option>
        </select>

        <label>Guests</label>
        <input type="number" name="guests" min="1" max="10" required>

        <label>Special Requests</label>
        <textarea name="special_requests" placeholder="Anything you want..."></textarea>

        <button type="submit">Book Now</button>

    </form>

</div>

</body>
</html>
